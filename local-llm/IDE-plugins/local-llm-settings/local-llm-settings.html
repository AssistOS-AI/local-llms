<div class="modal-header">
    <div class="modal-header-left">
        <div class="modal-title">Local LLMs</div>
        <div class="modal-subtitle">Run open-weight models on this workspace's GPU.</div>
    </div>
    <div class="close" data-local-action="closeModal" role="button" tabindex="0" aria-label="Close">
        <img class="close-icon" src="/explorer/shared/assets/icons/x-mark.svg" alt="">
    </div>
</div>
<div class="modal-body local-llm-launcher-body">
    <div class="settings-status loading" data-llm-launcher-status role="status" aria-live="polite">Opening Local LLMs…</div>
    <p class="settings-card-meta">Local LLMs opens in its own full-screen panel, also available from the Local LLMs button in the toolbar.</p>
    <div class="modal-actions">
        <button type="button" class="general-button" data-local-action="openDashboard" data-llm-open>Open Local LLMs</button>
    </div>
</div>
